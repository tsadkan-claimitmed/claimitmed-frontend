# Standalone frontend — proxies /api to host backend on port 3000
services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: claimitmed-frontend
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      API_URL: /api/v1
      API_BACKEND_URL: http://host.docker.internal:3000/api/
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 3
