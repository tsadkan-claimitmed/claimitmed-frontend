apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: claimitmed-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/claimitmed/claimitmed-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: API_URL
              value: 'https://YOUR-BACKEND-URL.run.app/api/v1'
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
