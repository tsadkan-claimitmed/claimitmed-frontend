apiVersion: apps/v1
kind: Deployment
metadata:
  name: claimitmed-frontend
  labels:
    app: claimitmed-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claimitmed-frontend
  template:
    metadata:
      labels:
        app: claimitmed-frontend
    spec:
      containers:
        - name: frontend
          image: claimitmed-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: '8080'
            - name: API_URL
              value: '/api/v1'
            - name: API_BACKEND_URL
              value: 'http://claimitmed-api:3000/api/'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: claimitmed-frontend
spec:
  selector:
    app: claimitmed-frontend
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
