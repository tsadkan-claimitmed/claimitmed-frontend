<div class="shell" [class.sidebar-collapsed]="sidebarCollapsed">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-icon">🏥</span>
      <div class="sidebar-brand">
        <h1 class="app-name">ClaimItMed</h1>
        <span class="portal-label">{{ portalLabel }}</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route.endsWith('/member') || item.route.endsWith('/provider') || item.route.endsWith('/insurer') || item.route.endsWith('/admin') || item.route.endsWith('/employer') }"
          class="nav-item"
          [title]="item.label"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (user$ | async; as user) {
        <div class="user-info">
          <span class="user-phone">{{ user.phone }}</span>
          @if (user.email) {
            <span class="user-email">{{ user.email }}</span>
          }
          <span class="user-role">{{ user.userType }}</span>
        </div>
      }
      <button type="button" class="btn-secondary btn-sm btn-block sign-out-btn" (click)="logout()">
        <span class="sign-out-icon" aria-hidden="true">⎋</span>
        <span class="sign-out-label">Sign out</span>
      </button>
    </div>
  </aside>

  <div class="shell-main">
    <header class="main-toolbar">
      <button
        type="button"
        class="sidebar-toggle"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="!sidebarCollapsed"
        aria-label="Toggle sidebar"
      >
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      <span class="toolbar-title">{{ portalLabel }}</span>
    </header>

    <main class="main-content">
      <router-outlet />
    </main>
  </div>
</div>
