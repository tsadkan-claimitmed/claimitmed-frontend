<div class="login-page">
  <div class="login-brand">
    <div class="brand-content">
      <div class="logo">
        <span class="logo-icon">🔐</span>
        <h1>ClaimItMed</h1>
      </div>
      <p class="tagline">Set a personal password before continuing</p>
      <p>For your security, you must change the temporary password provided by your administrator.</p>
    </div>
  </div>

  <div class="login-form-panel">
    <div class="form-container">
      <h2>Change your password</h2>
      <p class="form-subtitle">Choose a new password to access your member portal</p>

      @if (errorMessage) {
        <div class="alert alert-error">{{ errorMessage }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label" for="currentPassword">Current password</label>
          <input
            id="currentPassword"
            type="password"
            class="form-control"
            formControlName="currentPassword"
            autocomplete="current-password"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">New password</label>
          <input
            id="newPassword"
            type="password"
            class="form-control"
            formControlName="newPassword"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm new password</label>
          <input
            id="confirmPassword"
            type="password"
            class="form-control"
            formControlName="confirmPassword"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="btn-primary btn-block" [disabled]="loading">
          @if (loading) {
            <span class="spinner"></span> Updating...
          } @else {
            Update password
          }
        </button>
      </form>
    </div>
  </div>
</div>
