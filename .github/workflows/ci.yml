name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'staging-*'
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GCP environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  resolve-env:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')))
    outputs:
      environment: ${{ steps.pick.outputs.environment }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/staging-* ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported ref ${{ github.ref }}" >&2
            exit 1
          fi

  deploy:
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ENV: ${{ needs.resolve-env.outputs.environment }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      API_URL: ${{ vars.API_URL }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require environment variables
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "Set GitHub Actions environment variable GCP_PROJECT_ID on ${ENV}." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy frontend
        run: chmod +x deploy/gcp/deploy.sh deploy/gcp/common.sh && ./deploy/gcp/deploy.sh
