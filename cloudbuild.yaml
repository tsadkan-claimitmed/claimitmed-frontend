steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/claimitmed-frontend:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/claimitmed-frontend:latest
      - -f
      - docker/Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/claimitmed-frontend

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - claimitmed-frontend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/claimitmed-frontend:${_IMAGE_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=${_MEMORY}
      - --cpu=1
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --set-env-vars=API_URL=${_API_URL}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/claimitmed-frontend:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/claimitmed-frontend:latest

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: claimitmed
  _IMAGE_TAG: latest
  _API_URL: https://YOUR-BACKEND-URL.run.app/api/v1
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _MEMORY: 256Mi

options:
  logging: CLOUD_LOGGING_ONLY
